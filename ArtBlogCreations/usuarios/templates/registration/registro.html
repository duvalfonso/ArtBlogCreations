{% extends "base.html" %}

{% block title %}
  Registrarse | ArtBlog Creations
{% endblock %}

{% block content %}
  <section>
    <h1>Crear cuenta</h1>

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Registrarse</button>
    </form>
    <p>¿Ya tienes una cuenta? <a href="{% url 'login' %}">Inicia sesión</a></p>
  </section>
{% endblock %}
