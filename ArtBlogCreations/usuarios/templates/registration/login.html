{% extends "base.html" %}

{% block title %}
  Iniciar sesión | ArtBlog Creations
{% endblock %}

{% block content %}
  <section>
    <h1>Iniciar sesión</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      {% if next %}
        <input type="hidden" name="next" value="{{ next }}">
      {% endif %}
      <button type="submit">Iniciar sesión</button>
    </form>
    <p>¿No tienes una cuenta? <a href="{% url 'registro' %}">Regístrate</a></p>
  </section>
{% endblock %}
