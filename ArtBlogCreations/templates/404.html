{% extends "base.html" %}

{% block title %}
  Página no encontrada | ArtBlog Creations
{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center align-items-center min-vh-75">
    <div class="col-md-8 col-lg-6 text-center">
      
      <div class="card border-0 shadow-lg rounded-4 overflow-hidden p-4 p-md-5 bg-white">
        
        <div class="mb-4">
          <div class="d-inline-flex align-items-center justify-content-center bg-dark text-warning rounded-circle shadow-sm hw-90">
            <i class="bi bi-palette2 display-4"></i>
          </div>
        </div>

        <span class="badge bg-danger bg-opacity-10 text-danger px-3 py-2 rounded-pill fw-bold mb-2">Error 404</span>
        <h1 class="display-6 fw-bold text-dark mb-2">Lienzo en blanco</h1>
        <p class="text-muted mb-4">
          La obra o página que estás buscando no existe, ha sido movida o la dirección ingresada es incorrecta.
        </p>

        <div class="d-flex flex-column flex-sm-row justify-content-center gap-2">
          <a href="{% url 'inicio' %}" class="btn btn-dark py-2.5 px-4 rounded-3 fw-semibold shadow-sm">
            <i class="bi bi-house me-1"></i> Ir al inicio
          </a>
          <a href="{% url 'lista_publicaciones' %}" class="btn btn-outline-secondary py-2.5 px-4 rounded-3 fw-semibold">
            <i class="bi bi-compass me-1"></i> Explorar galería
          </a>
        </div>

      </div>

    </div>
  </div>
</div>
{% endblock %}
